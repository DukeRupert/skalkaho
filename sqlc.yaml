version: "2"
sql:
  - engine: "postgresql"
    queries: "sqlc/queries/"
    schema: "migrations/"
    gen:
      go:
        package: "repository"
        out: "internal/repository"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "pg_catalog.float4"
            go_type: "float64"
          - db_type: "pg_catalog.int4"
            go_type: "int64"
          - db_type: "serial"
            go_type: "int64"
