# =============================================================================
# Production Docker Compose for Skalkaho
# =============================================================================
# Usage:
#   docker compose up -d
#
# Environment variables (set in .env file on VPS):
#   - IMAGE_TAG: Docker image tag to deploy (default: latest)
#   - DOMAIN: Your domain name (e.g., skalkaho.example.com)
#   - POSTGRES_PASSWORD: PostgreSQL password (REQUIRED)
#   - SESSION_SECRET: Session signing secret (REQUIRED)
# =============================================================================

services:
  caddy:
    image: caddy:2-alpine
    container_name: skalkaho-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: skalkaho-postgres
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=skalkaho
      - POSTGRES_USER=skalkaho
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skalkaho -d skalkaho"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  app:
    image: dukerupert/skalkaho:${IMAGE_TAG:-latest}
    container_name: skalkaho-app
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - ADDR=:8080
      - DATABASE_URL=postgres://skalkaho:${POSTGRES_PASSWORD}@postgres:5432/skalkaho?sslmode=disable
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required}
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
