{{define "new_estimate_form"}}
<div class="bg-white rounded-lg border border-slate-200 p-4 mb-4">
    <h2 class="font-semibold text-slate-900 mb-3">Select Client</h2>
    <p class="text-sm text-slate-600 mb-4">An estimate requires a client to send to. Select an existing client or create a new one.</p>

    <form action="/jobs/{{.Job.ID}}/estimates" method="POST" class="space-y-4">
        {{if .Clients}}
        <div>
            <label for="client_id" class="block text-sm font-medium text-slate-700 mb-1">Client</label>
            <select name="client_id" id="client_id" required
                    class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-copper-500 focus:border-copper-500">
                <option value="">Select a client...</option>
                {{range .Clients}}
                <option value="{{.ID}}">{{.Name}}{{if .Company.Valid}} - {{.Company.String}}{{end}}</option>
                {{end}}
            </select>
        </div>
        {{else}}
        <div class="text-sm text-slate-600">
            <p>No clients found. <a href="/clients" class="text-copper-600 hover:text-copper-700">Create a client</a> first.</p>
        </div>
        {{end}}

        <div class="flex items-center gap-3 pt-2">
            {{if .Clients}}
            <button type="submit"
                    class="px-4 py-2 bg-copper-600 hover:bg-copper-700 text-white text-sm font-medium rounded-lg">
                Create Estimate
            </button>
            {{end}}
            <a href="/jobs/{{.Job.ID}}/estimates"
               class="px-4 py-2 text-slate-600 hover:text-slate-800 text-sm font-medium">
                Cancel
            </a>
        </div>
    </form>

    {{if .Clients}}
    <div class="mt-4 pt-4 border-t border-slate-200">
        <a href="/clients" class="text-sm text-copper-600 hover:text-copper-700">
            + Create new client
        </a>
    </div>
    {{end}}
</div>
{{end}}
