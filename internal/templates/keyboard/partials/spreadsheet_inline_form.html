{{define "spreadsheet_inline_form"}}
<div class="inline-form px-4 py-3 bg-slate-50 border-t border-slate-200" x-data="{ selectedType: 'material' }">
    <form hx-post="/categories/{{.CategoryID}}/items"
          hx-target="body"
          class="space-y-2"
          id="spreadsheet-item-form">
        <input type="hidden" name="job_id" value="{{.JobID}}">

        <!-- Type selector row -->
        <div class="flex items-center gap-2 mb-2">
            <label class="text-xs font-medium text-slate-500 uppercase tracking-wider">Type:</label>
            <div class="flex gap-1">
                <button type="button"
                        @click="selectedType = 'material'; document.getElementById('ss-type-input').value = 'material'; document.getElementById('ss-unit-input').value = 'ea'"
                        :class="selectedType === 'material' ? 'bg-forest-600 text-white' : 'bg-slate-200 text-slate-600 hover:bg-slate-300'"
                        class="px-2 py-1 rounded text-xs font-medium transition-colors">
                    Material
                </button>
                <button type="button"
                        @click="selectedType = 'labor'; document.getElementById('ss-type-input').value = 'labor'; document.getElementById('ss-unit-input').value = 'hr'"
                        :class="selectedType === 'labor' ? 'bg-copper-600 text-white' : 'bg-slate-200 text-slate-600 hover:bg-slate-300'"
                        class="px-2 py-1 rounded text-xs font-medium transition-colors">
                    Labor
                </button>
                <button type="button"
                        @click="selectedType = 'equipment'; document.getElementById('ss-type-input').value = 'equipment'; document.getElementById('ss-unit-input').value = 'day'"
                        :class="selectedType === 'equipment' ? 'bg-slate-700 text-white' : 'bg-slate-200 text-slate-600 hover:bg-slate-300'"
                        class="px-2 py-1 rounded text-xs font-medium transition-colors">
                    Equipment
                </button>
                {{range $ct := .CustomTypes}}
                <button type="button"
                        @click="selectedType = '{{$ct.Slug}}'; document.getElementById('ss-type-input').value = '{{$ct.Slug}}'; document.getElementById('ss-unit-input').value = 'ea'"
                        :class="selectedType === '{{$ct.Slug}}' ? 'bg-{{$ct.Color}}-600 text-white' : 'bg-slate-200 text-slate-600 hover:bg-slate-300'"
                        class="px-2 py-1 rounded text-xs font-medium transition-colors">
                    {{$ct.Name}}
                </button>
                {{end}}
            </div>
        </div>

        <input type="hidden" name="type" id="ss-type-input" value="material">

        <!-- Fields row (grid matching spreadsheet columns) -->
        <div class="grid grid-cols-12 gap-2 items-center">
            <div class="col-span-4 relative">
                <input type="text"
                       name="name"
                       id="ss-name-input"
                       placeholder="Item name..."
                       class="w-full px-2 py-1 border border-slate-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-slate-400 bg-white"
                       autocomplete="off"
                       autofocus
                       required>
                <div id="ss-autocomplete-container"></div>
            </div>

            <input type="number"
                   name="quantity"
                   id="ss-quantity-input"
                   value="1"
                   step="0.01"
                   min="0.01"
                   class="col-span-2 px-2 py-1 border border-slate-300 rounded text-sm text-right focus:outline-none focus:ring-2 focus:ring-slate-400 bg-white">

            <input type="text"
                   name="unit"
                   id="ss-unit-input"
                   value="ea"
                   placeholder="unit"
                   class="col-span-2 px-2 py-1 border border-slate-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-slate-400 bg-white">

            <div class="col-span-2 flex items-center border border-slate-300 rounded focus-within:ring-2 focus-within:ring-slate-400 overflow-hidden bg-white">
                <span class="pl-2 text-slate-500 text-sm shrink-0">$</span>
                <input type="number"
                       name="unit_price"
                       id="ss-price-input"
                       value="0.00"
                       step="0.01"
                       min="0"
                       placeholder="0.00"
                       class="min-w-0 flex-1 px-1 py-1 text-sm text-right focus:outline-none border-0 bg-transparent [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
            </div>

            <div class="col-span-2 flex gap-1">
                <button type="submit"
                        class="px-2 py-1 bg-slate-900 text-white rounded text-xs hover:bg-slate-700">
                    Save
                </button>
                <button type="button"
                        onclick="hideSpreadsheetForm()"
                        class="px-2 py-1 bg-slate-200 text-slate-700 rounded text-xs hover:bg-slate-300">
                    Cancel
                </button>
            </div>
        </div>
    </form>
    <p class="text-xs text-slate-400 mt-1">
        <kbd class="font-mono text-xs px-1 py-0.5 bg-slate-100 border border-slate-300 rounded text-slate-700">Tab</kbd> next field
        <kbd class="font-mono text-xs px-1 py-0.5 bg-slate-100 border border-slate-300 rounded text-slate-700 ml-1">Enter</kbd> save
        <kbd class="font-mono text-xs px-1 py-0.5 bg-slate-100 border border-slate-300 rounded text-slate-700 ml-1">Esc</kbd> cancel
    </p>
</div>
<script>
(function() {
    const input = document.getElementById('ss-name-input');
    const container = document.getElementById('ss-autocomplete-container');
    const typeInput = document.getElementById('ss-type-input');
    let debounceTimer;
    let selectedIndex = -1;

    function getItems() {
        return container.querySelectorAll('.autocomplete-item');
    }

    function updateSelection() {
        const items = getItems();
        items.forEach((item, i) => {
            item.classList.toggle('bg-slate-100', i === selectedIndex);
        });
    }

    function selectItem(item) {
        input.value = item.dataset.name;
        document.getElementById('ss-unit-input').value = item.dataset.unit;
        document.getElementById('ss-price-input').value = item.dataset.price;
        container.innerHTML = '';
        selectedIndex = -1;
        document.getElementById('ss-quantity-input').focus();
        document.getElementById('ss-quantity-input').select();
    }

    function positionDropdown() {
        const rect = input.getBoundingClientRect();
        const dropdown = container.querySelector('.autocomplete-results');
        if (dropdown) {
            dropdown.style.position = 'fixed';
            dropdown.style.top = rect.bottom + 'px';
            dropdown.style.left = rect.left + 'px';
            dropdown.style.width = rect.width + 'px';
        }
    }

    input.addEventListener('input', function() {
        clearTimeout(debounceTimer);
        const query = this.value.trim();

        if (query.length < 2) {
            container.innerHTML = '';
            return;
        }

        debounceTimer = setTimeout(() => {
            const itemType = typeInput.value;
            htmx.ajax('GET', '/items/search?type=' + encodeURIComponent(itemType) + '&q=' + encodeURIComponent(query), {
                target: '#ss-autocomplete-container',
                swap: 'innerHTML'
            }).then(() => {
                selectedIndex = -1;
                positionDropdown();
                getItems().forEach(item => {
                    item.addEventListener('click', () => selectItem(item));
                });
            });
        }, 150);
    });

    input.addEventListener('keydown', function(e) {
        const items = getItems();
        if (items.length === 0) return;

        if (e.key === 'ArrowDown') {
            e.preventDefault();
            selectedIndex = Math.min(selectedIndex + 1, items.length - 1);
            updateSelection();
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            selectedIndex = Math.max(selectedIndex - 1, -1);
            updateSelection();
        } else if (e.key === 'Enter' && selectedIndex >= 0) {
            e.preventDefault();
            selectItem(items[selectedIndex]);
        } else if (e.key === 'Escape') {
            container.innerHTML = '';
            selectedIndex = -1;
        }
    });

    document.addEventListener('click', function(e) {
        if (!container.contains(e.target) && e.target !== input) {
            container.innerHTML = '';
            selectedIndex = -1;
        }
    });
})();
</script>
{{end}}
