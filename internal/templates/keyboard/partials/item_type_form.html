{{define "item_type_form"}}
<div class="px-4 py-4 bg-slate-50 border-b border-slate-200">
    <form hx-post="/jobs/{{.Job.ID}}/item-types"
          hx-target="body"
          class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Name</label>
                <input type="text"
                       name="name"
                       placeholder="e.g., Subcontractor"
                       class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-copper-500 focus:border-copper-500"
                       required
                       oninput="autoGenerateSlug(this)">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Slug (auto-generated)</label>
                <input type="text"
                       name="slug"
                       id="slug-input"
                       placeholder="e.g., subcontractor"
                       class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-copper-500 focus:border-copper-500 bg-slate-50"
                       pattern="[a-z0-9-]+"
                       title="Lowercase letters, numbers, and hyphens only">
                <p class="text-xs text-slate-500 mt-1">Used internally to identify this type</p>
            </div>
        </div>

        <div class="flex items-center justify-between">
            <div class="flex items-center gap-4">
                <button type="submit"
                        class="px-4 py-2 bg-copper-600 hover:bg-copper-700 text-white text-sm font-medium rounded-lg transition-colors">
                    Add Type
                </button>
                <button type="button"
                        onclick="hideItemTypeForm()"
                        class="px-4 py-2 text-slate-600 hover:text-slate-800 text-sm font-medium">
                    Cancel
                </button>
            </div>
            <span class="hidden sm:inline text-xs text-slate-400">
                <kbd class="font-mono px-1.5 py-0.5 bg-slate-100 border border-slate-300 rounded">Enter</kbd> save
                <kbd class="font-mono px-1.5 py-0.5 bg-slate-100 border border-slate-300 rounded ml-1">Esc</kbd> cancel
            </span>
        </div>
    </form>
</div>

<script>
function autoGenerateSlug(input) {
    const slugInput = document.getElementById('slug-input');
    if (!slugInput || slugInput.dataset.userModified) return;

    let slug = input.value.toLowerCase()
        .replace(/\s+/g, '-')
        .replace(/[^a-z0-9-]/g, '')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '');

    slugInput.value = slug;
}

// Track if user manually modified the slug
document.getElementById('slug-input')?.addEventListener('input', function() {
    this.dataset.userModified = 'true';
});
</script>
{{end}}
