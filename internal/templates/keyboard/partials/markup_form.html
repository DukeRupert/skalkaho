{{define "markup_form"}}
<div class="inline-form px-4 py-3 border-b border-slate-200 bg-slate-50">
    <form hx-put="/jobs/{{.Job.ID}}/markup"
          hx-target="body"
          class="space-y-3">
        <p class="text-slate-600 font-medium text-sm">Type Markups</p>

        <!-- Standard types -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div>
                <label class="block text-xs text-slate-500 mb-1">Material</label>
                <div class="flex items-center gap-1">
                    <input type="number"
                           name="material_surcharge_percent"
                           value="{{if .Job.MaterialSurchargePercent.Valid}}{{printf "%.1f" .Job.MaterialSurchargePercent.Float64}}{{end}}"
                           step="0.1"
                           min="0"
                           max="100"
                           placeholder="—"
                           class="w-20 px-2 py-1.5 border border-slate-300 rounded text-sm text-right focus:outline-none focus:ring-2 focus:ring-slate-400">
                    <span class="text-slate-400 text-sm">%</span>
                </div>
            </div>
            <div>
                <label class="block text-xs text-slate-500 mb-1">Labor</label>
                <div class="flex items-center gap-1">
                    <input type="number"
                           name="labor_surcharge_percent"
                           value="{{if .Job.LaborSurchargePercent.Valid}}{{printf "%.1f" .Job.LaborSurchargePercent.Float64}}{{end}}"
                           step="0.1"
                           min="0"
                           max="100"
                           placeholder="—"
                           class="w-20 px-2 py-1.5 border border-slate-300 rounded text-sm text-right focus:outline-none focus:ring-2 focus:ring-slate-400">
                    <span class="text-slate-400 text-sm">%</span>
                </div>
            </div>
            <div>
                <label class="block text-xs text-slate-500 mb-1">Equipment</label>
                <div class="flex items-center gap-1">
                    <input type="number"
                           name="equipment_surcharge_percent"
                           value="{{if .Job.EquipmentSurchargePercent.Valid}}{{printf "%.1f" .Job.EquipmentSurchargePercent.Float64}}{{end}}"
                           step="0.1"
                           min="0"
                           max="100"
                           placeholder="—"
                           class="w-20 px-2 py-1.5 border border-slate-300 rounded text-sm text-right focus:outline-none focus:ring-2 focus:ring-slate-400">
                    <span class="text-slate-400 text-sm">%</span>
                </div>
            </div>
            <div>
                <label class="block text-xs text-slate-500 mb-1">Default</label>
                <div class="flex items-center gap-1">
                    <input type="number"
                           name="surcharge_percent"
                           value="{{printf "%.1f" .Job.SurchargePercent}}"
                           step="0.1"
                           min="0"
                           max="100"
                           class="w-20 px-2 py-1.5 border border-slate-300 rounded text-sm text-right focus:outline-none focus:ring-2 focus:ring-slate-400"
                           autofocus
                           required>
                    <span class="text-slate-400 text-sm">%</span>
                </div>
            </div>
        </div>

        {{if .CustomTypes}}
        <p class="text-xs text-slate-500 pt-1">Custom type markups are set in <a href="/jobs/{{.Job.ID}}/item-types" class="text-slate-700 underline">Manage Item Types</a></p>
        {{end}}

        <div class="flex items-center gap-2 pt-1">
            <button type="submit"
                    class="px-3 py-1.5 bg-slate-900 text-white rounded text-sm hover:bg-slate-700">
                Save
            </button>
            <button type="button"
                    onclick="hideMarkupForm()"
                    class="px-3 py-1.5 bg-slate-200 text-slate-700 rounded text-sm hover:bg-slate-300">
                Cancel
            </button>
        </div>
    </form>
    <p class="text-xs text-slate-400 mt-2">
        Empty fields use Default.
        <kbd class="font-mono text-xs px-1 py-0.5 bg-slate-100 border border-slate-300 rounded text-slate-600">Enter</kbd> save
        <kbd class="font-mono text-xs px-1 py-0.5 bg-slate-100 border border-slate-300 rounded text-slate-600 ml-1">Escape</kbd> cancel
    </p>
</div>
{{end}}
