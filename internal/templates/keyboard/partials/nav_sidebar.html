{{define "nav_sidebar"}}
<aside class="nav-sidebar hidden lg:flex flex-col w-56 shrink-0 bg-white border-r border-slate-200"
       :class="sidebarOpen ? 'nav-sidebar-open' : ''">

    <!-- Mobile overlay backdrop -->

         x-cloak
         @click="sidebarOpen = false"
         class="lg:hidden fixed inset-0 bg-black/50 z-40"></div>

    <!-- Sidebar content -->

                transform transition-transform duration-200 ease-out
                -translate-x-full lg:translate-x-0 flex flex-col"
         :class="sidebarOpen ? 'translate-x-0' : ''">

        <!-- Logo (mobile only) -->
        <div class="lg:hidden p-4 border-b border-slate-200">
            <a href="/" class="flex items-center gap-2">
                <svg width="28" height="22" viewBox="0 0 56 44" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 0 44 Q 9 38, 18 4 Q 27 38, 36 44 Z" fill="#1e293b" opacity="0.35"/>
                    <path d="M 20 44 Q 29 38, 38 4 Q 47 38, 56 44 Z" fill="#1e293b"/>
                </svg>
                <span class="font-bold tracking-wider text-slate-900">SKALKAHO</span>
            </a>
        </div>

        <!-- Navigation links -->
        <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
            <a href="/" class="nav-link" data-nav="quotes">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                Quotes
            </a>
            <a href="/clients" class="nav-link" data-nav="clients">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                </svg>
                Clients
            </a>
            <a href="/items" class="nav-link" data-nav="items">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                </svg>
                Items
            </a>

            <div class="pt-4 mt-4 border-t border-slate-200">
                <a href="/price-import" class="nav-link" data-nav="import">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                    </svg>
                    Import

                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                    Settings
                </a>
            </div>
        </nav>
    </div>
</aside>

<script>
// Active navigation highlighting
(function() {
    function updateActiveNav() {
        const path = window.location.pathname;
        document.querySelectorAll('.nav-link').forEach(link => {
            link.classList.remove('active');
            const href = link.getAttribute('href');
            // Quotes: home or /jobs/*
            if (link.dataset.nav === 'quotes' && (path === '/' || path.startsWith('/jobs'))) {
                link.classList.add('active');
            }
            // Clients: /clients/*
            else if (link.dataset.nav === 'clients' && path.startsWith('/clients')) {
                link.classList.add('active');
            }
            // Items: /items/*
            else if (link.dataset.nav === 'items' && path.startsWith('/items')) {
                link.classList.add('active');
            }
            // Import: /price-import/*
            else if (link.dataset.nav === 'import' && path.startsWith('/price-import')) {
                link.classList.add('active');
            }
            // Settings: /settings
            else if (link.dataset.nav === 'settings' && path === '/settings') {
                link.classList.add('active');
            }
        });
    }

    document.addEventListener('DOMContentLoaded', updateActiveNav);
    document.addEventListener('htmx:afterSwap', updateActiveNav);
})();
</script>
{{end}}
