{{define "login"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Skalkaho</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                fontFamily: {
                    sans: ['Barlow', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                },
                colors: {
                    slate: {
                        50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1',
                        400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155',
                        800: '#1e293b', 900: '#0f172a', 950: '#020617',
                    },
                    copper: {
                        50: '#fdf4f3', 100: '#fce8e4', 200: '#fbd5cd', 300: '#f7b7a9',
                        400: '#f08b76', 500: '#e4664b', 600: '#d14a2e', 700: '#af3c24',
                        800: '#913522', 900: '#7a3122',
                    },
                }
            }
        }
    }
    </script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center gap-2">
                <svg width="40" height="32" viewBox="0 0 56 44" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 0 44 Q 9 38, 18 4 Q 27 38, 36 44 Z" fill="#1e293b" opacity="0.35"/>
                    <path d="M 20 44 Q 29 38, 38 4 Q 47 38, 56 44 Z" fill="#1e293b"/>
                </svg>
                <span class="text-2xl font-bold tracking-wider text-slate-900">SKALKAHO</span>
            </a>
            <p class="mt-2 text-slate-600">Construction Quoting Software</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-xl shadow-lg border border-slate-200 p-8">
            <h1 class="text-xl font-semibold text-slate-900 mb-6">Sign in to your account</h1>

            {{if .Error}}
            <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700">
                {{.Error}}
            </div>
            {{end}}

            <form method="POST" action="/login" class="space-y-4">
                {{if .Redirect}}
                <input type="hidden" name="redirect" value="{{.Redirect}}">
                {{end}}

                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
                    <input type="email" id="email" name="email" required autofocus
                           value="{{.Email}}"
                           class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-slate-900 shadow-sm focus:border-copper-500 focus:outline-none focus:ring-2 focus:ring-copper-500/20"
                           placeholder="you@company.com">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
                    <input type="password" id="password" name="password" required
                           class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-slate-900 shadow-sm focus:border-copper-500 focus:outline-none focus:ring-2 focus:ring-copper-500/20"
                           placeholder="Enter your password">
                </div>

                <div class="flex items-center justify-between text-sm">
                    <a href="/forgot-password" class="text-copper-600 hover:text-copper-700">Forgot password?</a>
                </div>

                <button type="submit"
                        class="w-full bg-slate-900 text-white font-medium py-2.5 px-4 rounded-lg hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-500 focus:ring-offset-2 transition-colors">
                    Sign in
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-200 text-center text-sm text-slate-600">
                Don't have an account?
                <a href="/register" class="text-copper-600 hover:text-copper-700 font-medium">Create one</a>
            </div>
        </div>

        <p class="mt-6 text-center text-xs text-slate-500">
            Skalkaho - Named after Skalkaho Pass, Montana
        </p>
    </div>
</body>
</html>
{{end}}
