{{define "estimate_builder"}}
<!DOCTYPE html>
<html lang="en">
<head>
    {{template "head" .}}
</head>
<body class="bg-slate-50 pb-12" data-job-id="{{.Job.ID}}" x-data="{ sidebarOpen: false }">
    {{template "header" .}}

    <!-- Back link (hidden, used by JS) -->
    <a data-back-url="/jobs/{{.Job.ID}}" class="hidden"></a>

    <div class="flex min-h-[calc(100vh-3rem)]">
        {{template "nav_sidebar" .}}

        <div class="flex-1 overflow-x-hidden">
            <!-- Svelte mounts here -->
            <div id="estimate-root" data-project-id="{{.Job.ID}}"></div>
        </div>
    </div>

    {{template "footer" .}}
    {{template "help_overlay" .}}
    {{template "scripts" .}}

    <!-- Estimate Builder Svelte bundle (loaded only on this page) -->
    <script type="module" src="/static/estimate-builder/estimate-builder.js"></script>
</body>
</html>
{{end}}
