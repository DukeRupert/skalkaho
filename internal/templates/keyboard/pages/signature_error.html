{{define "signature_error"}}
<!DOCTYPE html>
<html lang="en">
<head>
    {{template "head" .}}
</head>
<body class="bg-slate-50">
    <!-- Simple header for public page -->
    <header class="border-b border-slate-200 px-4 py-3 bg-white">
        <div class="max-w-3xl mx-auto flex items-center justify-center">
            <svg width="28" height="22" viewBox="0 0 56 44" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M 0 44 Q 9 38, 18 4 Q 27 38, 36 44 Z" fill="#334155" opacity="0.35"/>
                <path d="M 20 44 Q 29 38, 38 4 Q 47 38, 56 44 Z" fill="#334155"/>
            </svg>
            <span class="ml-2 font-bold tracking-wider text-slate-900">SKALKAHO</span>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-6">
        <!-- Error Card -->
        <div class="bg-white rounded-lg border border-slate-200 p-8 text-center">
            <!-- X Icon -->
            <div class="mx-auto w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mb-6">
                <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </div>

            <h1 class="text-2xl font-bold text-slate-900 mb-2">{{.Title}}</h1>

            <p class="text-slate-600 mb-6">
                {{.Message}}
            </p>

            <p class="text-sm text-slate-500">
                If you believe this is an error, please contact the sender to request a new signing link.
            </p>
        </div>
    </main>
</body>
</html>
{{end}}
