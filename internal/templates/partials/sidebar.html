{{define "sidebar"}}
<aside class="fixed top-0 left-0 w-[220px] h-screen bg-white border-r border-gray-200 flex flex-col">
    <!-- Logo -->
    <div class="px-5 py-5 border-b border-gray-100">
        <a href="/" class="text-lg font-bold text-gray-900">Skalkaho</a>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-3 py-4 space-y-1">
        <a href="/"
            class="flex items-center gap-3 px-3 py-2 rounded-md text-sm font-medium {{if eq .ActivePage "projects"}}bg-blue-50 text-blue-700{{else}}text-gray-700 hover:bg-gray-50{{end}}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
            </svg>
            Projects
        </a>
        <a href="/clients"
            class="flex items-center gap-3 px-3 py-2 rounded-md text-sm font-medium {{if eq .ActivePage "clients"}}bg-blue-50 text-blue-700{{else}}text-gray-700 hover:bg-gray-50{{end}}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            Clients
        </a>
        <a href="/materials"
            class="flex items-center gap-3 px-3 py-2 rounded-md text-sm font-medium {{if eq .ActivePage "materials"}}bg-blue-50 text-blue-700{{else}}text-gray-700 hover:bg-gray-50{{end}}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
            </svg>
            Materials
        </a>
        <a href="/rates"
            class="flex items-center gap-3 px-3 py-2 rounded-md text-sm font-medium {{if eq .ActivePage "rates"}}bg-blue-50 text-blue-700{{else}}text-gray-700 hover:bg-gray-50{{end}}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            Rates
        </a>

        {{if .Project}}
        <!-- Current Project section -->
        <div class="mt-6 pt-4 border-t border-gray-200">
            <p class="px-3 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Current Project</p>
            <p class="px-3 text-sm font-medium text-gray-900 mb-2 truncate" title="{{.Project.Name}}">{{.Project.Name}}</p>
            <a href="/projects/{{.Project.ID}}"
                class="flex items-center gap-3 px-3 py-2 rounded-md text-sm font-medium {{if eq .ActivePage "overview"}}bg-blue-50 text-blue-700{{else}}text-gray-700 hover:bg-gray-50{{end}}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                </svg>
                Overview
            </a>
            <a href="/projects/{{.Project.ID}}/estimate"
                class="flex items-center gap-3 px-3 py-2 rounded-md text-sm font-medium {{if eq .ActivePage "estimate"}}bg-blue-50 text-blue-700{{else}}text-gray-700 hover:bg-gray-50{{end}}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                </svg>
                Estimate Builder
            </a>
            <a href="/"
                class="flex items-center gap-3 px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:bg-gray-50 mt-1">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 17l-5-5m0 0l5-5m-5 5h12"/>
                </svg>
                Back to Projects
            </a>
        </div>
        {{end}}
    </nav>

    <!-- User -->
    <div class="px-5 py-4 border-t border-gray-200">
        <p class="text-sm font-medium text-gray-700 truncate">{{.UserName}}</p>
        <a href="/logout" class="text-xs text-gray-500 hover:text-gray-700">Sign out</a>
    </div>
</aside>
{{end}}
