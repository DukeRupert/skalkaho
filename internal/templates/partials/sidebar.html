{{define "sidebar"}}
<!-- Overlay for mobile -->
<div class="sidebar-overlay"
     x-data="{ open: false }"
     x-on:sidebar-toggle.window="open = !open"
     x-on:keydown.escape.window="open = false"
     x-bind:class="open ? 'sidebar-overlay--visible' : ''"
     x-on:click="open = false"
     x-cloak>
</div>

<aside class="sidebar"
       x-data="{ open: false }"
       x-on:sidebar-toggle.window="open = !open"
       x-on:keydown.escape.window="open = false"
       x-bind:class="open ? 'sidebar--open' : ''">
    <!-- Mobile hamburger toggle — lives inside sidebar so it slides with it -->
    <button class="sidebar-toggle" x-on:click="$dispatch('sidebar-toggle')" aria-label="Toggle navigation">
        <svg class="sidebar-toggle-icon sidebar-toggle-open" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
        <svg class="sidebar-toggle-icon sidebar-toggle-close" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"/>
        </svg>
    </button>

    <!-- Vertical accent rule -->
    <div class="sidebar-accent"></div>

    <!-- Logo -->
    <div class="sidebar-logo">
        <a href="/" class="sidebar-logo-link">
            <img src="/static/logo-dark.svg" alt="Skalkaho" class="sidebar-logo-img" />
            <div class="sidebar-logo-text">
                <span class="sidebar-logo-name">Skalkaho</span>
                <span class="sidebar-logo-sub">Estimating</span>
            </div>
            <img src="/static/logo-dark.svg" alt="S" class="sidebar-logo-mark" />
        </a>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">
        <a href="/" title="Projects"
            class="sidebar-link {{if eq .ActivePage "projects"}}sidebar-link--active{{end}}">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
            </svg>
            <span class="sidebar-label">Projects</span>
        </a>
        <a href="/clients" title="Clients"
            class="sidebar-link {{if eq .ActivePage "clients"}}sidebar-link--active{{end}}">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            <span class="sidebar-label">Clients</span>
        </a>
        <a href="/materials" title="Materials"
            class="sidebar-link {{if eq .ActivePage "materials"}}sidebar-link--active{{end}}">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
            </svg>
            <span class="sidebar-label">Materials</span>
        </a>
        <a href="/rates" title="Rates"
            class="sidebar-link {{if eq .ActivePage "rates"}}sidebar-link--active{{end}}">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span class="sidebar-label">Rates</span>
        </a>
        <a href="/subcontractors" title="Subcontractors"
            class="sidebar-link {{if eq .ActivePage "subcontractors"}}sidebar-link--active{{end}}">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
            </svg>
            <span class="sidebar-label">Subs</span>
        </a>
        <a href="/templates" title="Templates"
            class="sidebar-link {{if eq .ActivePage "templates"}}sidebar-link--active{{end}}">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"/>
            </svg>
            <span class="sidebar-label">Templates</span>
        </a>

        {{if .Project}}
        <!-- Current Project section -->
        <div class="sidebar-section">
            <div class="sidebar-section-label">Current Project</div>
            <p class="sidebar-project-name" title="{{.Project.Name}}">{{.Project.Name}}</p>
            <a href="/projects/{{.Project.ID}}" title="Overview"
                class="sidebar-link {{if eq .ActivePage "overview"}}sidebar-link--active{{end}}">
                <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                </svg>
                <span class="sidebar-label">Overview</span>
            </a>
            <a href="/projects/{{.Project.ID}}/estimate" hx-boost="false" title="Estimate Builder"
                class="sidebar-link {{if eq .ActivePage "estimate"}}sidebar-link--active{{end}}">
                <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                </svg>
                <span class="sidebar-label">Estimate Builder</span>
            </a>
            <a href="/" title="Back to Projects"
                class="sidebar-link sidebar-link--back">
                <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11 17l-5-5m0 0l5-5m-5 5h12"/>
                </svg>
                <span class="sidebar-label">Back to Projects</span>
            </a>
        </div>
        {{end}}
    </nav>

    <!-- User -->
    <div class="sidebar-user">
        <p class="sidebar-user-name">{{.UserName}}</p>
        <a href="/logout" hx-boost="false" class="sidebar-user-logout" title="Sign out">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            <span class="sidebar-label">Sign out</span>
        </a>
    </div>
</aside>
{{end}}
